apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsuf-engines-private
spec:
  podSelector:
    matchLabels: {app: dsuf-engine}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: dsuf-gateway}
      ports:
        - {protocol: TCP, port: 8000}
    - from:
        - podSelector:
            matchLabels: {app: dsuf-engine}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dsuf-redis-private
spec:
  podSelector:
    matchLabels: {app: dsuf-redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: dsuf-engine}
      ports:
        - {protocol: TCP, port: 6379}
