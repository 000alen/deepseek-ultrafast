apiVersion: v1
kind: Service
metadata:
  name: dsuf-redis
spec:
  selector: {app: dsuf-redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsuf-redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: dsuf-redis}
  template:
    metadata:
      labels: {app: dsuf-redis}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7
          args: ["--save", "", "--appendonly", "no", "--protected-mode", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
