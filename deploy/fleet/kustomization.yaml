apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - engines.yaml
  - gateway.yaml
  - redis.yaml
  - network.yaml
configMapGenerator:
  - name: dsuf-gateway-config
    files:
      - gateway.json
images:
  - name: deepseek-ultrafast
    newName: registry.example.invalid/deepseek-ultrafast
    newTag: replace-with-build
  - name: deepseek-ultrafast-gateway
    newName: registry.example.invalid/deepseek-ultrafast-gateway
    newTag: replace-with-build
