apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsuf-standard
spec:
  template:
    spec:
      containers:
        - name: serve
          env:
            - name: DSUF_DP_SIZE
              value: '8'
            - name: DSUF_MAX_SEQS_PER_RANK
              value: '256'
            - name: DSUF_MAX_BATCHED_TOKENS
              value: '8192'
            - name: DSUF_PREFILL_INTERVAL
              value: '96'
            - name: DSUF_ENGRAM_CONFIG
              value: '{"cpu_offload":false,"embedding_across_dp":true}'
            - name: DSUF_ATTENTION_CONFIG
              value: '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          resources:
            requests:
              cpu: '32'
              memory: 512Gi
            limits:
              memory: 512Gi
              nvidia.com/gpu: 8
