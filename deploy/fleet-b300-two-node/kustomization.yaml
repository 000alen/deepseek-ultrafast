apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../fleet
replicas:
  - name: dsuf-standard
    count: 4
  - name: dsuf-long
    count: 0
configMapGenerator:
  - name: dsuf-gateway-config
    behavior: replace
    files:
      - gateway.json
patches:
  - path: engine-placement.yaml
    target:
      kind: StatefulSet
      name: 'dsuf-(standard|long)'
  - path: control-placement.yaml
    target:
      kind: Deployment
      name: 'dsuf-(gateway|redis)'
  - path: standard-engine.yaml
  - target:
      kind: PodDisruptionBudget
      name: dsuf-standard
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 3
