[package]
name = "deepseek-ultrafast-gateway"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
futures = "0.3"
lru = "0.18.5"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
